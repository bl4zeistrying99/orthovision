# Shared experiment protocol. Every encoder uses THIS file (identical-protocol comparison).
# Personal overrides go in configs/local.yaml (git-ignored).
seed: 42

paths:
  data_root: data/raw/MRNet-v1.0     # folder containing train/, valid/, *.csv
  processed: data/processed
  outputs: outputs

data:
  planes: [axial, coronal, sagittal]
  labels: [abnormal, acl, meniscus]
  image_size: 224                    # ViT/Swin pretrained default; resize from 256
  val_fraction: 0.15                 # carved from official train, split at exam level
  # MRNet's official test set is hidden; official `valid` (120 exams) is our held-out TEST.
  test_source: official_valid
  num_workers: 2

train:
  epochs: 30
  batch_size: 1                      # exams per step (variable slice counts)
  accum_steps: 8                     # gradient accumulation -> effective batch of 8 exams
  eval_batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-2
  lr_patience: 2                     # halve LR if val macro-AUC stalls this many epochs
  early_stop_patience: 6
  grad_clip: 1.0
  pooling: max                       # slice -> series (max pooling, per synopsis 4.3)
  use_pos_weight: true               # weighted BCE (synopsis Eq. 4.1): neg/pos per label
  amp: true                          # mixed precision on GPU
  max_slices_train: 24               # random slice subset per plane per step (memory + augmentation)
  slice_chunk: 24                    # slices pushed through the backbone at once
  grad_checkpoint: true              # trade ~30% speed for much lower GPU memory
  freeze_bn: true                    # BatchNorm in eval mode (slices of one exam are not iid)

models:
  names: [resnet50, efficientnet_b0, vit, swin]
  timm_ids:
    resnet50: resnet50
    efficientnet_b0: efficientnet_b0
    vit: vit_base_patch16_224
    swin: swin_tiny_patch4_window7_224
  dropout: 0.3                       # needed for MC Dropout later

uncertainty:
  mc_passes: 30
